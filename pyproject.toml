[project]
name = "citation-faithfulness"
version = "0.1.0"
description = "Reproducible citation-faithfulness experiments for retrieval-augmented generation"
authors = [
    { name = "Abimbola Jeremiah", email = "jeremiahabimbola0@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "huggingface-hub>=1.27.0",
    "joblib>=1.5.3",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "sentence-transformers>=5.7.0",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "transformer-lens>=3.7.2",
    "transformers>=4.50.0",
    "typer>=0.27.1",
]

[project.scripts]
citation-faithfulness = "citation_faithfulness.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
